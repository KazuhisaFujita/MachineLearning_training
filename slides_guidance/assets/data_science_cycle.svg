<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf7ef" />
      <stop offset="100%" stop-color="#eef6f1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f665f" />
    </marker>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)" rx="36" />
  <text x="600" y="82" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="38" font-weight="700" fill="#143a36">データ分析の基本サイクル</text>

  <circle cx="600" cy="360" r="245" fill="none" stroke="#d98f3d" stroke-width="12" stroke-dasharray="12 20" />

  <g font-family="Hiragino Sans, Noto Sans JP, sans-serif" text-anchor="middle">
    <g>
      <circle cx="600" cy="155" r="88" fill="#ffffff" stroke="#143a36" stroke-width="4" />
      <text x="600" y="145" font-size="30" font-weight="700" fill="#143a36">1</text>
      <text x="600" y="185" font-size="28" fill="#143a36">データを見る</text>
    </g>
    <g>
      <circle cx="845" cy="300" r="88" fill="#fff4e5" stroke="#9a4d16" stroke-width="4" />
      <text x="845" y="290" font-size="30" font-weight="700" fill="#9a4d16">2</text>
      <text x="845" y="330" font-size="28" fill="#9a4d16">可視化する</text>
    </g>
    <g>
      <circle cx="750" cy="545" r="88" fill="#eef6f1" stroke="#2f665f" stroke-width="4" />
      <text x="750" y="535" font-size="30" font-weight="700" fill="#2f665f">3</text>
      <text x="750" y="575" font-size="28" fill="#2f665f">仮説を立てる</text>
    </g>
    <g>
      <circle cx="450" cy="545" r="88" fill="#f7efe7" stroke="#8e6a4d" stroke-width="4" />
      <text x="450" y="535" font-size="30" font-weight="700" fill="#8e6a4d">4</text>
      <text x="450" y="575" font-size="28" fill="#8e6a4d">モデルを試す</text>
    </g>
    <g>
      <circle cx="355" cy="300" r="88" fill="#f0f3fb" stroke="#4a6485" stroke-width="4" />
      <text x="355" y="290" font-size="30" font-weight="700" fill="#4a6485">5</text>
      <text x="355" y="330" font-size="28" fill="#4a6485">評価・解釈</text>
    </g>
  </g>

  <path d="M 680 190 C 760 205, 815 235, 845 255" fill="none" stroke="#2f665f" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 870 385 C 865 455, 828 505, 785 540" fill="none" stroke="#2f665f" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 670 592 C 605 620, 525 620, 470 592" fill="none" stroke="#2f665f" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 400 535 C 360 500, 325 445, 323 380" fill="none" stroke="#2f665f" stroke-width="6" marker-end="url(#arrow)" />
  <path d="M 378 248 C 425 205, 500 178, 550 175" fill="none" stroke="#2f665f" stroke-width="6" marker-end="url(#arrow)" />

  <text x="600" y="360" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#143a36">重要なのは</text>
  <text x="600" y="408" text-anchor="middle" font-family="Hiragino Sans, Noto Sans JP, sans-serif" font-size="34" font-weight="700" fill="#9a4d16">往復しながら理解を深めること</text>
</svg>
